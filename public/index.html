<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scare App</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#000;color:#eee;font:15px/1.4 system-ui,sans-serif;overflow:hidden}
  /* video and overlay canvas share identical sizing so landmarks line up */
  #v,#overlay{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .unmirrored #v,.unmirrored #overlay{transform:none}
  #overlay{pointer-events:none}
  #start{position:fixed;inset:0;display:grid;place-items:center;text-align:center}
  #start button{font-size:18px;padding:14px 28px}
  #bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;
       background:rgba(0,0,0,.55);border-radius:12px;backdrop-filter:blur(8px);transition:opacity .4s}
  #bar.hide{opacity:0;pointer-events:none}
  button,select{background:#222;color:#eee;border:1px solid #444;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
  button:hover,select:hover{background:#333}
  button[aria-pressed="true"]{background:#0a3;border-color:#2e6;color:#fff}
  button:disabled{opacity:.6;cursor:wait}
  #msg{color:#f88;max-width:320px;margin-top:12px}
  [hidden]{display:none!important}
  /* scare meter */
  #meter{position:fixed;right:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;
         padding:12px 10px;background:rgba(0,0,0,.55);border-radius:14px;backdrop-filter:blur(8px);font-variant-numeric:tabular-nums}
  #meter .label{font-weight:700;letter-spacing:.12em;font-size:12px}
  #meter .track{position:relative;width:28px;height:min(45vh,420px);border-radius:14px;overflow:hidden;
         background:linear-gradient(to top,#0c3 0%,#fd0 50%,#f20 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
  #meter .cover{position:absolute;inset:0 0 auto 0;height:100%;background:#151515;transition:height .08s linear}
  #meter .pct{font-size:20px;font-weight:700;min-width:3.2ch;text-align:center}
  #meter .parts{font-size:11px;line-height:1.5;opacity:.85;text-align:left;min-width:9ch}
  #meter.noface .pct{opacity:.4}
  button{white-space:nowrap}
  @media (max-width:480px){
    #bar{gap:4px;padding:6px;bottom:12px;max-width:calc(100vw - 16px)}
    #bar button,#bar select{padding:7px 8px;font-size:13px}
    #meter{right:8px;padding:8px 6px}
    #meter .track{width:20px;height:min(38vh,300px)}
    #meter .pct{font-size:16px}
  }
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>

<div id="start">
  <div>
    <button id="go">Start mirror</button>
    <p id="msg"></p>
  </div>
</div>

<div id="meter" hidden aria-label="Scare meter">
  <div class="label">SCARE</div>
  <div class="track"><div class="cover" id="cover"></div></div>
  <div class="pct" id="pct">0%</div>
  <div class="parts">L eye <b id="le">0</b><br>R eye <b id="re">0</b><br>Mouth <b id="mo">0</b></div>
</div>

<div id="bar" hidden>
  <select id="cams" title="Camera"></select>
  <button id="dots" aria-pressed="true" disabled>Face dots: loading…</button>
  <button id="flip">Flip</button>
  <button id="snap">Snapshot</button>
  <button id="fs">Fullscreen</button>
</div>

<script type="module">
import { FilesetResolver, FaceLandmarker }
  from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.1/vision_bundle.mjs';

const WASM  = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.1/wasm';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const DOT_COLOR = '#00ff66';

// Scare meter tuning: ratio -> 0..1. Raise MAX values if the meter fills too easily.
const EYE_MIN = 0.12, EYE_MAX = 0.42;     // eye height / eye width (closed .. very wide)
const MOUTH_MIN = 0.05, MOUTH_MAX = 0.75; // inner lip gap / mouth width (closed .. wide open)
const SMOOTH = 0.25;                      // 0..1, higher = faster, jumpier bar

const $ = id => document.getElementById(id);
const v = $('v'), cams = $('cams'), bar = $('bar'), dotsBtn = $('dots');
const overlay = $('overlay'), ctx = overlay.getContext('2d');
let stream, landmarker, showDots = true, lastTime = -1, started = false;
let scare = 0, missed = 0;

// ---------- MediaPipe ----------
async function setupVision() {
  const fileset = await FilesetResolver.forVisionTasks(WASM);
  const opts = delegate => ({
    baseOptions: { modelAssetPath: MODEL, delegate },
    runningMode: 'VIDEO',
    numFaces: 2
  });
  try {
    landmarker = await FaceLandmarker.createFromOptions(fileset, opts('GPU'));
  } catch {
    landmarker = await FaceLandmarker.createFromOptions(fileset, opts('CPU'));
  }
}

function drawDots(faces) {
  const w = overlay.width, h = overlay.height, r = Math.max(1.5, w / 700);
  ctx.fillStyle = DOT_COLOR;
  ctx.beginPath();
  for (const face of faces) {
    for (const p of face) {
      ctx.moveTo(p.x * w + r, p.y * h);
      ctx.arc(p.x * w, p.y * h, r, 0, Math.PI * 2);
    }
  }
  ctx.fill();
}

// ---------- Scare meter ----------
// MediaPipe face mesh indices. "Left" = the person's left eye.
const L_EYE = { a: 33,  b: 133, v: [[160, 144], [158, 153]] };
const R_EYE = { a: 362, b: 263, v: [[385, 380], [387, 373]] };
const MOUTH = { a: 78,  b: 308, v: [[13, 14]] };

const clamp01 = x => Math.min(1, Math.max(0, x));
const norm = (x, lo, hi) => clamp01((x - lo) / (hi - lo));

function openRatio(face, part) {
  const w = overlay.width, h = overlay.height;
  const d = (i, j) => Math.hypot((face[i].x - face[j].x) * w, (face[i].y - face[j].y) * h);
  const vert = part.v.reduce((sum, [i, j]) => sum + d(i, j), 0) / part.v.length;
  return vert / d(part.a, part.b);
}

const $cover = $('cover'), $pct = $('pct'), $le = $('le'), $re = $('re'), $mo = $('mo'), $meter = $('meter');
function updateMeter(face) {
  if (face) {
    missed = 0;
    const le = norm(openRatio(face, L_EYE), EYE_MIN, EYE_MAX);
    const re = norm(openRatio(face, R_EYE), EYE_MIN, EYE_MAX);
    const mo = norm(openRatio(face, MOUTH), MOUTH_MIN, MOUTH_MAX);
    const avg = (le + re + mo) / 3;
    scare += (avg - scare) * SMOOTH;
    $le.textContent = Math.round(le * 100); $re.textContent = Math.round(re * 100); $mo.textContent = Math.round(mo * 100);
    $meter.classList.remove('noface');
  } else if (++missed > 10) {           // no face for a moment: let the bar fall
    scare += (0 - scare) * 0.1;
    $meter.classList.add('noface');
  }
  $cover.style.height = (100 - scare * 100) + '%';
  $pct.textContent = Math.round(scare * 100) + '%';
}

function onFrame(now) {
  if (!landmarker) return;
  const res = landmarker.detectForVideo(v, now);
  updateMeter(res.faceLandmarks[0]);
  if (showDots) drawDots(res.faceLandmarks);
}

function loop(now) {
  if (v.readyState >= 2 && v.currentTime !== lastTime) {
    lastTime = v.currentTime;
    if (overlay.width !== v.videoWidth || overlay.height !== v.videoHeight) {
      overlay.width = v.videoWidth; overlay.height = v.videoHeight;
    }
    ctx.clearRect(0, 0, overlay.width, overlay.height);
    try { onFrame(now); } catch (e) { console.error(e); }
  }
  requestAnimationFrame(loop);
}

function setDots(on) {
  showDots = on;
  dotsBtn.setAttribute('aria-pressed', on);
  dotsBtn.textContent = 'Face dots: ' + (on ? 'on' : 'off');
  if (!on) ctx.clearRect(0, 0, overlay.width, overlay.height);
}

// ---------- Camera ----------
async function start(deviceId) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    v.srcObject = stream;
    $('start').hidden = true;
    bar.hidden = false;
    await listCams();
    if (!started) {
      started = true;
      requestAnimationFrame(loop);
      setupVision()
        .then(() => { dotsBtn.disabled = false; setDots(true); $meter.hidden = false; })
        .catch(e => { console.error(e); dotsBtn.textContent = 'Face dots: failed'; });
    }
  } catch (e) {
    $('msg').textContent = 'Camera error: ' + e.message + ' (page must be on https and camera allowed)';
  }
}

async function listCams() {
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const current = stream.getVideoTracks()[0].getSettings().deviceId;
  cams.innerHTML = devices.map((d, i) =>
    `<option value="${d.deviceId}" ${d.deviceId === current ? 'selected' : ''}>${d.label || 'Camera ' + (i + 1)}</option>`).join('');
  cams.hidden = devices.length < 2;
}

// ---------- Controls ----------
$('go').onclick = () => start();
cams.onchange = () => start(cams.value);
dotsBtn.onclick = () => setDots(!showDots);
$('flip').onclick = () => document.body.classList.toggle('unmirrored');
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
$('snap').onclick = () => {
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  const x = c.getContext('2d');
  if (!document.body.classList.contains('unmirrored')) { x.translate(c.width, 0); x.scale(-1, 1); }
  x.drawImage(v, 0, 0);
  x.drawImage(overlay, 0, 0);
  const a = document.createElement('a');
  a.download = 'scare-app-' + Date.now() + '.png';
  a.href = c.toDataURL('image/png');
  a.click();
};

// auto-hide controls when idle
let t;
const wake = () => { bar.classList.remove('hide'); clearTimeout(t); t = setTimeout(() => bar.classList.add('hide'), 3000); };
['mousemove', 'touchstart', 'keydown'].forEach(e => addEventListener(e, wake));
wake();

// keyboard: D = dots, F = fullscreen, M = flip
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if (k === 'd' && !dotsBtn.disabled) dotsBtn.click();
  if (k === 'f') $('fs').click();
  if (k === 'm') $('flip').click();
});
</script>
</body>
</html>
